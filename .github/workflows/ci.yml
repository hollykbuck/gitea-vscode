name: CI Build, Test & Package

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    ci:
        name: Lint, Test, Build & Package
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Setup Display Server (xvfb)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libxkbcommon-x11-0 libxkbcommon0

            - name: Run Tests
              run: xvfb-run -a npm test
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Package VSIX
              run: npm run package

            - name: Upload VSIX Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: opengitea-vsix
                  path: '*.vsix'
                  if-no-files-found: error

    release:
        name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download VSIX
              uses: actions/download-artifact@v4
              with:
                  name: opengitea-vsix
                  path: .

            - name: Create GitHub Release
              run: gh release create "${{ github.ref_name }}" "${{ github.workspace }}"/*.vsix --generate-notes --repo "${{ github.repository }}"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
